# ==============================================================================
# FinPaluse — Render Unified Service Blueprint
# ==============================================================================
# Deploys BOTH Frontend and Backend on a SINGLE Render Web Service instance.
# No CORS issues, single URL for UI and API, optimal resource utilization.

services:
  - type: web
    name: finpaluse
    runtime: python
    plan: free
    region: oregon
    buildCommand: npm install && npm run build && cd backend && pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 20.14.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: SEED_DEMO_DATA
        value: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: postgresql+asyncpg://postgres:Ghsthakur%40123@db.ikilxctcgqsilkaeilww.supabase.co:5432/postgres?ssl=require
      - key: DATABASE_URL_SYNC
        value: postgresql://postgres:Ghsthakur%40123@db.ikilxctcgqsilkaeilww.supabase.co:5432/postgres?sslmode=require
      - key: SUPABASE_URL
        value: https://ikilxctcgqsilkaeilww.supabase.co
      - key: SECRET_KEY
        generateValue: true
